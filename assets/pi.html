<!DOCTYPE html>
<html lang="en">
	<head>
		<script>
			let update = () => {};
			let value = false;

			function connectOpenActionSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				websocket.onopen = () => {
					websocket.send(JSON.stringify({
						event: inRegisterEvent,
						uuid: inPropertyInspectorUUID,
					}));
				};
				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);
					if (data.event == "didReceiveSettings") {
					}
				};

				const channel = document.getElementById("channel");
				channel.value = inActionInfo.payload.settings.channel ?? 1;

				update = () => {
					console.log("update: "+channel.value)
					websocket.send(JSON.stringify({
						event: "setSettings",
						context: inActionInfo.context,
						payload: {
							channel: parseInt(channel.value) || 1,
							value: 0,
						},
					}));
				};
			}

			const connectElgatoStreamDeckSocket = connectOpenActionSocket;
		</script>

		<style>
			* {
				font-family: system-ui, sans-serif;
				font-size: 16px;
				color: oklch(92.2% 0 0);
			}
			body {
				margin: 16px;
				background-color: oklch(26.9% 0 0);
			}
			label {
				margin-right: 4px;
			}
			input {
				padding: 4px;
				background-color: oklch(37.1% 0 0);
				border: 1px solid oklch(43.9% 0 0);
				border-radius: 8px;
			}
		</style>
	</head>

	<body>
		<div>
			<label for="channel">Channel:</label>
			<input id="channel" oninput="update();" type="number" />
		</div>
	</body>
</html>
